/camera/camera:
  ros__parameters:
    enable_color: true
    enable_depth: false

    rgb_camera:
      color_profile: "1280x720x30"
      color_format: RGB8

      enable_auto_exposure: false
      exposure: 90
      gain: 16

      brightness: 10
      contrast: 50
      gamma: 325
      saturation: 64
      sharpness: 50
      hue: 0
      backlight_compensation: false

      enable_auto_white_balance: false
      white_balance: 4600.0

      power_line_frequency: 3
      global_time_enabled: true
